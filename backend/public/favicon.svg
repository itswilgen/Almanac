      stroke-linejoin="round"
    />
    <path
      d="M12 21c-3.8 0-6.5-1.5-6.5-4.5 3.8 0 6.5 1.5 6.5 4.5Z"
      fill="#e8899e"
      fill-opacity="0.25"
