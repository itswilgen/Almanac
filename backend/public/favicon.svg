  </defs>
  <!-- Squircle container -->
  <rect width="32" height="32" rx="8" fill="url(#almanac-bg)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#eed4dc" stroke-width="1" />
  
  <!-- Flower2 botanical brandmark -->
