<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="almanac-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff8f9" />
      <stop offset="100%" stop-color="#f6e8ec" />
    </linearGradient>
    <linearGradient id="almanac-petal" x1="6" y1="4" x2="26" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c74a68" />
      <stop offset="100%" stop-color="#9b253e" />
